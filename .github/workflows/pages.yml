name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build articles pipeline (sitemap, search index, RSS)
        run: node scripts/build-articles.mjs

      - name: Build car catalog (cars.json)
        run: node scripts/build-cars.mjs

      - name: Build Jordan mobility and energy research pages
        run: node scripts/build-jordan-guides.mjs

      - name: Build Arabic Jordan study editions
        run: node scripts/build-jordan-guides-ar.mjs

      - name: Build French and Portuguese Jordan study editions
        run: node scripts/build-jordan-guides-fr-pt.mjs

      - name: Add quantitative solar EV feasibility case study in all locales
        run: node scripts/enhance-solar-ev-jordan-study.mjs

      - name: Build author profiles and content authority metadata
        run: node scripts/build-author-authority.mjs

      - name: Build page structured data (JSON-LD)
        run: node scripts/build-structured-data.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
